<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BracketSense — learn how a Stack solves the balanced brackets problem through interactive visualization, prediction, experimentation and challenges." />
    <meta name="theme-color" content="#FBF7F1" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>BracketSense — Watch the Stack think</title>
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      (function () {
        var theme = 'light'
        try {
          var saved = JSON.parse(localStorage.getItem('bracketsense:settings:v1') || 'null')
          if (saved && (saved.theme === 'light' || saved.theme === 'dark')) theme = saved.theme
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark'
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>BracketSense needs JavaScript to run the interactive Stack visualizer.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
